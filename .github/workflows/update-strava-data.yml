name: Update Strava Data

# Strava removed the /clubs/{id}/activities, /members and /admins endpoints on
# 2026-09-01, which silently broke the old API pipeline (fetch-data.js). There
# is no replacement endpoint, so data now comes from Strava's own embeddable
# club widget via fetch-widget.js. No OAuth token is involved any more.
#
# The widget reports the CURRENT WEEK only, so widget-history.json accumulates
# one entry per week and must be committed, or every run starts from an empty
# history on a fresh checkout and the cumulative total collapses.

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch club data via embed widget
        env:
          STRAVA_CLUB_ID: "1491053"
          STRAVA_WIDGET_TOKEN: ${{ secrets.STRAVA_WIDGET_TOKEN }}
        run: node strava-dashboard/fetch-widget.js

      # Rebuilds strava-data.json, which the published dashboard, the Wix embed
      # and the macOS widget all read. --with-estimates includes the documented
      # 2026-09-01..2026-09-15 outage gap; the split stays visible in
      # dataSource.measuredDistanceKm vs dataSource.estimatedGapKm.
      - name: Rebuild dashboard data
        run: node strava-dashboard/build-dashboard-data.js --with-estimates

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add strava-dashboard/widget-data.json strava-dashboard/widget-history.json strava-dashboard/strava-data.json
          git diff --cached --quiet || git commit -m "chore: update strava data $(date -u +'%Y-%m-%d')"
          git push
