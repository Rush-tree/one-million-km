name: Update Strava Data

on:
  # Primary trigger: external cron-job.org calls workflow_dispatch via REST API
  # every hour — far more reliable than GitHub's internal cron scheduler.
  # Kept one internal schedule as a fallback in case the external trigger fails.
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch: # used by cron-job.org and manual GitHub UI triggers

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Strava data
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_CLUB_ID: "1491053"
        run: node strava-dashboard/fetch-data.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # member-history.json MUST be committed too: it is the only record of
          # who was in the club on which day. Without it the runner starts from
          # a fresh checkout every hour, the member baseline is lost, and joiner
          # detection can never produce a diff.
          git add strava-dashboard/strava-data.json strava-dashboard/strava-cache.json strava-dashboard/member-history.json
          git diff --cached --quiet || git commit -m "chore: update strava data $(date -u +'%Y-%m-%d')"
          git push
